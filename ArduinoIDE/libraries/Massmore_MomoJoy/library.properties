name=Massmore_MomoJoy
version=2.1.0
author=Massmore Biz Co., Ltd.
maintainer=Massmore Biz Co., Ltd. <massmore.shop>
sentence=BLE HID gamepad host for ESP32 and ESP32-S3 - MOMO Joystick Controller (SKU-1001).
paragraph=Scans for a BLE HID gamepad, bonds with it, reads and parses the HID Report Map at runtime, subscribes to the input reports and decodes them into a normalised gamepad state (sticks -512..511, analog triggers 0..1023, D-pad, 18 buttons, battery). Works with any BLE HID controller because no byte layout is hard-coded. Requires arduino-esp32 core 3.x and NimBLE-Arduino 2.x. Ten examples from a five-line sketch to a production factory test.
category=Communication
url=https://github.com/Massmore/MOMO_Q34Joystick
architectures=esp32
depends=NimBLE-Arduino
includes=Massmore_MomoJoy.h
