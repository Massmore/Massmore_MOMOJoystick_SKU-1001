; =============================================================================
;  Massmore_MomoJoy - PlatformIO project   (c) Massmore Biz Co., Ltd.
;  MOMO Joystick Controller SKU-1001  -  BLE HID gamepad host
;
;  Nothing to install: NimBLE-Arduino 2.x lives in lib/ and the Massmore
;  library is picked up from ../ArduinoIDE/libraries, so both toolchains
;  compile the exact same source files.
;  ไม่ต้องติดตั้งอะไรเพิ่ม เปิดโฟลเดอร์นี้ใน VS Code แล้ว Build ได้เลย
;
;  Quick start:
;    1) open this folder in VS Code (PlatformIO extension installed)
;    2) pick the example (1-6): edit MOMO_EXAMPLE at the top of src/main.cpp
;    3) Build / Upload / Monitor
;
;  Command line:
;    pio run -e esp32s3 -t upload -t monitor     <- default board
;    pio run -e esp32   -t upload -t monitor     <- classic ESP32
;    pio run -e factorytest_esp32s3              <- builds firmware/*.bin
; =============================================================================

[platformio]
name         = Massmore_MomoJoy
default_envs = esp32s3
src_dir      = src
lib_dir      = lib

; ---------------------------------------------------------------------------
[common]
; pioarduino platform = arduino-esp32 core 3.x (ESP-IDF 5.x).
; Pinned on purpose: the library uses the core 3.x LEDC API and NimBLE 2.x.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

; Single source of truth: the same files the Arduino IDE compiles.
lib_extra_dirs = ${PROJECT_DIR}/../ArduinoIDE/libraries
lib_ldf_mode   = deep+

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize, time

; --- Upload speed on macOS -------------------------------------------------
; 921600 is the fastest that is still reliable on most USB-serial bridges.
; If uploading fails ("Failed to write to target RAM", "Timed out waiting for
; packet header"), drop to 512000 and then 460800.
;   ถ้าอัพโหลดไม่ผ่าน ให้ลดเป็น 512000 แล้ว 460800 ตามลำดับ
upload_speed = 921600
; upload_speed = 512000
; upload_speed = 460800

build_flags =
    ; Serial -> UART0 so the log goes to the USB-serial bridge, not USB-OTG.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    ; NimBLE: central role only, one connection. Saves flash and ~40 KB RAM.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_NVS_PERSIST=1
    -std=gnu++17
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
;  ESP32-S3 (default) - MOMO board: N16R8 = 16 MB flash + 8 MB OPI PSRAM
; ---------------------------------------------------------------------------
[env:esp32s3]
extends = common
board    = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM

; Many USB-serial bridges reset the board when the monitor opens DTR/RTS.
; Keep them low so the log is not lost. Delete to get auto-reset back.
monitor_rts = 0
monitor_dtr = 0

; ---------------------------------------------------------------------------
;  Classic ESP32 (WROOM-32, 4 MB flash)
;  huge_app.csv is required: BLE + Arduino core does not fit the default 1.25 MB
; ---------------------------------------------------------------------------
[env:esp32]
extends = common
board    = esp32dev
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
;  Factory Test firmware (example 10). Used by firmware/build_firmware.sh
; ---------------------------------------------------------------------------
[env:factorytest_esp32s3]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DMOMO_EXAMPLE=6

[env:factorytest_esp32]
extends = env:esp32
build_flags =
    ${common.build_flags}
    -DMOMO_EXAMPLE=6
